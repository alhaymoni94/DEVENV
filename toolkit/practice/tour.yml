title: "Interactive Terminal Stack Tour"
intro: "Welcome to the AUT Linux Camp! This 2-minute tour shows you everything available in your terminal."
outro: "You're all set! Type 'camp-next' to start your first lesson. Remember: cheat is your friend!"

- title: "Your AI Assistant"
  description: "Ask AI anything directly from the terminal. No browser needed."
  command: "ai \"what is the difference between TCP and UDP?\""
  tip: "You can also pipe files: cat file.py | ai \"explain this code\""

- title: "File Management"
  description: "Navigate files visually with yazi, or edit with micro."
  command: "y"
  tip: "Press 'q' to quit yazi. Use 'e filename' to edit files in micro."
    - "y = open file manager"
    - "e = open editor"
    - "Ctrl+S = save in micro"
    - "Ctrl+Q = quit micro"

- title: "Git Made Easy"
  description: "lazygit makes git visual and intuitive."
  command: "lg"
  tip: "Space to stage, c to commit, P to push."
    - "lg = open lazygit"
    - "Space = stage file"
    - "c = commit"
    - "P = push"

- title: "Help System"
  description: "Never get stuck — the cheat system has you covered."
  command: "cheat --home"
  tip: "Use 'qr micro' for a quick reference, or 'cheat --undo git' when you mess up."
    - "cheat = browse all topics"
    - "qr <tool> = quick reference"
    - "cheat --undo = recovery guide"
    - "cheat --quiz = test yourself"

- title: "Track Your Progress"
  description: "Know exactly where you are and what to do next."
  command: "camp-progress"
  tip: "Use 'camp-next' to see your next lesson, and 'camp-submit' when ready for review."
    - "camp-progress = see progress"
    - "camp-next = what's next"
    - "camp-submit = submit work"
    - "evaluate = supervisor grading"
