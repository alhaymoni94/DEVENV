# =============================================================================
# GENERAL SETTINGS
# =============================================================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color support
set -g history-limit 50000
set -sg escape-time 0
set -g mouse on
set -g focus-events on

# Scroll wheel: enter copy-mode on wheel-up, pass through if already scrolling
bind -n WheelUpPane   if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'
bind -n WheelDownPane if -Ft= '#{pane_in_mode}' 'send-keys -M' ''
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

# =============================================================================
# PREFIX: Ctrl+a
# =============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix           # Ctrl+a Ctrl+a sends literal Ctrl+a to terminal

# =============================================================================
# KEY BINDINGS
# =============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Intuitive splits (open in same directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in same directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation with arrow keys (no prefix needed after first move)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Copy mode — arrow keys to navigate, Enter to copy, q to quit
# Use Shift+drag in terminal to copy directly to system clipboard
bind Enter copy-mode
setw -g mode-keys emacs

# Swap windows left/right
bind-key S-Left  swap-window -t -1 \; select-window -t -1
bind-key S-Right swap-window -t +1 \; select-window -t +1

# Kill pane/window without confirm
bind x kill-pane
bind X kill-window

# =============================================================================
# COLORS & THEME
# =============================================================================
# Base colors (dark blue/teal theme)
color_bg="#1a1b26"
color_fg="#c0caf5"
color_accent="#7aa2f7"
color_green="#9ece6a"
color_yellow="#e0af68"
color_red="#f7768e"
color_orange="#ff9e64"
color_purple="#bb9af7"
color_cyan="#7dcfff"
color_gray="#565f89"
color_darkgray="#24283b"
color_lightgray="#a9b1d6"

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message bar
set -g message-style "fg=#c0caf5,bg=#1a1b26,bold"
set -g message-command-style "fg=#c0caf5,bg=#1a1b26"

# Mode (copy mode etc.)
set -g mode-style "fg=#1a1b26,bg=#7aa2f7"

# =============================================================================
# STATUS BAR
# =============================================================================
set -g status on
set -g status-interval 2          # refresh every 2 seconds
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#c0caf5,bg=#1a1b26"

# ---------- LEFT SIDE ----------
# [session] | host
set -g status-left-length 60
set -g status-left "\
#[fg=#1a1b26,bg=#7aa2f7,bold] #S \
#[fg=#7aa2f7,bg=#3b4261,nobold]\
#[fg=#a9b1d6,bg=#3b4261] #h \
#[fg=#3b4261,bg=#1a1b26]  "

# ---------- WINDOW TABS ----------
setw -g window-status-separator ""
setw -g window-status-style "fg=#565f89,bg=#1a1b26"
setw -g window-status-format "\
#[fg=#1a1b26,bg=#1a1b26] \
#[fg=#565f89,bg=#24283b] #I:#W#{?window_zoomed_flag, ,} \
#[fg=#24283b,bg=#1a1b26]"

setw -g window-status-current-style "fg=#c0caf5,bg=#1a1b26,bold"
setw -g window-status-current-format "\
#[fg=#1a1b26,bg=#7aa2f7]\
#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W#{?window_zoomed_flag, Z,} \
#[fg=#7aa2f7,bg=#1a1b26]"

setw -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"

# ---------- RIGHT SIDE ----------
# CPU | MEM | ↑↓ net | disk | battery | date & time
set -g status-right-length 160
set -g status-right "\
#[fg=#3b4261,bg=#1a1b26]\
#[fg=#a9b1d6,bg=#3b4261]  \
#(top -bn1 | grep 'Cpu(s)' | awk '{printf \"CPU: %4.1f%%\", 100 - $8}') \
#[fg=#565f89]│#[fg=#a9b1d6]\
#(free -m | awk 'NR==2{printf \"RAM: %dM / %dM\", $3, $2}') \
#[fg=#565f89]│#[fg=#a9b1d6]\
#(df -h / | awk 'NR==2{printf \"Disk: %s/%s (%s)\", $3,$2,$5}') \
#[fg=#3b4261]  \
#[fg=#1a1b26,bg=#3b4261]\
#[fg=#3b4261,bg=#bb9af7]\
#[fg=#1a1b26,bg=#bb9af7,bold] #{?client_prefix,PREFIX ,}\
#[fg=#1a1b26,bg=#7aa2f7,bold] %a %d %b \
#[fg=#1a1b26,bg=#7dcfff,bold] %H:%M "
