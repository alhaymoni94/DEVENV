# Intelli-Shell Commands — AUT Terminal Stack
# Import: intelli-shell import commands.yml
# Updated: 2026-04-27

# ── Shell Essentials ───────────────────────────────────────────────────────────

- description: "Go up one directory"
  command: "cd .."

- description: "Go up two directories"
  command: "cd ../.."

- description: "Go to previous directory"
  command: "cd -"

- description: "Reset broken PATH"
  command: "export PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$HOME/.local/bin:$HOME/.cargo/bin"

- description: "List recent commands"
  command: "history | tail -20"

- description: "Run last command with sudo"
  command: "sudo !!"

# ── Navigation (yazi + zoxide) ─────────────────────────────────────────────────

- description: "Open file manager (yazi)"
  command: "yazi"

- description: "Open yazi at specific path"
  command: "yazi ~/path"

- description: "Jump to recent directories (zoxide)"
  command: "zoxide add"

- description: "Open zoxide interactive selector"
  command: "z"

# ── Editor (micro) ───────────────────────────────────────────────────────────

- description: "Edit file in micro"
  command: "micro file"

- description: "Open current directory in micro"
  command: "micro ."

- description: "Create and edit new file"
  command: "micro newfile.py"

# ── Git (lazygit + gh) ───────────────────────────────────────────────────────

- description: "Open lazygit TUI"
  command: "lazygit"

- description: "Open GitHub CLI dashboard"
  command: "gh dash"

- description: "Stage all and commit"
  command: "git add -A && git commit -m 'commit message'"

- description: "Push to remote"
  command: "git push"

- description: "Pull from remote"
  command: "git pull"

- description: "Create new branch and checkout"
  command: "git checkout -b branch-name"

- description: "Amend last commit"
  command: "git commit --amend --no-edit"

- description: "Undo last commit, keep changes"
  command: "git reset --soft HEAD~1"

- description: "View git log as graph"
  command: "git log --oneline --graph --all -20"

- description: "Stash changes"
  command: "git stash"

- description: "Apply stashed changes"
  command: "git stash pop"

- description: "Create PR"
  command: "gh pr create --fill"

- description: "List open PRs"
  command: "gh pr list"

- description: "View PR status"
  command: "gh pr status"

# ── tmux ──────────────────────────────────────────────────────────────────────

- description: "Create new tmux session"
  command: "tmux new -s session-name"

- description: "List tmux sessions"
  command: "tmux ls"

- description: "Attach to last session"
  command: "tmux attach"

- description: "Attach to specific session"
  command: "tmux attach -t session-name"

- description: "Kill session"
  command: "tmux kill-session -t session-name"

- description: "Reload tmux config"
  command: "tmux source-file ~/.tmux.conf"

# ── AI Tools ──────────────────────────────────────────────────────────────────

- description: "Start AI chat (llm)"
  command: "llm chat"

- description: "Ask AI a question"
  command: "llm 'your question here'"

- description: "Explain code with AI"
  command: "cat file.py | llm 'explain this code'"

- description: "Generate code with AI"
  command: "llm 'write a python script that does X'"

- description: "Open AI agent (opencode)"
  command: "opencode"

- description: "Ask AI to read file"
  command: "opencode path/to/file.py"

# ── System Monitoring ────────────────────────────────────────────────────────

- description: "Open system monitor (btop)"
  command: "btop"

- description: "Open Docker TUI (lazydocker)"
  command: "lazydocker"

- description: "List running containers"
  command: "docker ps"

- description: "List all containers"
  command: "docker ps -a"

- description: "List Docker images"
  command: "docker images"

- description: "Stop all containers"
  command: "docker stop $(docker ps -q)"

- description: "Remove stopped containers"
  command: "docker container prune -f"

# ── Data Tools (visidata) ───────────────────────────────────────────────────

- description: "Open CSV in visidata"
  command: "visidata file.csv"

- description: "Open JSON in visidata"
  command: "visidata file.json"

- description: "Open Excel in visidata"
  command: "visidata file.xlsx"

# ── Diagrams ──────────────────────────────────────────────────────────────────

- description: "Render D2 diagram to SVG"
  command: "d2 file.d2 file.svg"

- description: "Render D2 diagram to PNG"
  command: "d2 file.d2 file.png --dark"

- description: "Render Mermaid to PNG"
  command: "mmdc -i diagram.mmd -o diagram.png"

# ── Terminal Utilities ────────────────────────────────────────────────────────

- description: "Render markdown with glow"
  command: "glow file.md"

- description: "Render markdown from URL"
  command: "glow https://raw.githubusercontent.com/..."

- description: "Navigate git diffs (diffnav)"
  command: "diffnav"

- description: "Show directory tree"
  command: "treemd"

# ── Cheat System ──────────────────────────────────────────────────────────────

- description: "Browse cheatsheets (fzf)"
  command: "cheat --browse"

- description: "View cheatsheet for tool"
  command: "cheat tool-name"

- description: "Quick reference for tool"
  command: "cheat --quick tool-name"

- description: "Show random tip"
  command: "cheat --daily"

- description: "Run quiz for topic"
  command: "cheat --quiz topic"

- description: "List all cheatsheets"
  command: "cheat --list"

- description: "Undo guide for tool"
  command: "cheat --undo tool-name"

- description: "Workflow guide"
  command: "cheat --workflow name"

- description: "First-run tour"
  command: "cheat --start"

- description: "Search all cheatsheets"
  command: "cheat --search term"

# ── Docker Compose ────────────────────────────────────────────────────────────

- description: "Start services (detached)"
  command: "docker compose up -d"

- description: "Start and rebuild"
  command: "docker compose up -d --build"

- description: "Stop services"
  command: "docker compose down"

- description: "View logs (follow)"
  command: "docker compose logs -f"

- description: "Execute in container"
  command: "docker compose exec service-name sh"

- description: "View service status"
  command: "docker compose ps"

# ── Camp CLI ──────────────────────────────────────────────────────────────────

- description: "Show next lesson"
  command: "camp next"

- description: "Show progress"
  command: "camp progress"

- description: "Submit phase for review"
  command: "camp submit 1"

- description: "Evaluate student work"
  command: "camp evaluate student-name 1"

# ── Workflows ─────────────────────────────────────────────────────────────────

- description: "Start dev session (tmux + editor)"
  command: "tmux new -s dev -n editor && micro ."

- description: "Run stack health check"
  command: "bash $TOOLKIT/doctor.sh"

- description: "Run setup"
  command: "bash $TOOLKIT/setup.sh"

- description: "Apply dotfiles (chezmoi)"
  command: "chezmoi apply"

- description: "Edit chezmoi source file"
  command: "chezmoi edit dot_zshrc"

# ── Runtime Management (mise) ────────────────────────────────────────────────

- description: "List installed tools"
  command: "mise ls"

- description: "Install tool version"
  command: "mise install node@20"

- description: "Run tool with mise"
  command: "mise exec -- node --version"

- description: "Show current tool versions"
  command: "mise current"

# ── File Operations ────────────────────────────────────────────────────────────

- description: "Create file"
  command: "touch filename"

- description: "Create directory"
  command: "mkdir dirname"

- description: "Find files by name"
  command: "find . -name '*.py' -type f"

- description: "Find files modified today"
  command: "find . -mtime -1"

- description: "List directory by size"
  command: "du -sh */ | sort -h"

# ── Quick Aliases ────────────────────────────────────────────────────────────

- description: "List files long"
  command: "ls -la"

- description: "List directories only"
  command: "ls -d */"

- description: "Show disk usage"
  command: "df -h"

- description: "Show memory usage"
  command: "free -h"

- description: "Show process tree"
  command: "pstree"